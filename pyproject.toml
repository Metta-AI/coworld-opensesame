[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coworld-opensesame"
version = "0.1.1"
description = "Open Sesame: simultaneous prompt-injection attack/defense PvP for Coworld"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
open-sesame-game = "opensesame.server:main"
open-sesame-player = "opensesame.player:main"

[tool.hatch.build.targets.wheel]
packages = ["opensesame"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
